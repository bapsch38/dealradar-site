name: Classer les retours communautaires

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'community-feedback') || startsWith(github.event.issue.title, '[Communauté]') || startsWith(github.event.issue.title, 'Retour communauté') || startsWith(github.event.issue.title, 'Signalement communauté')
    runs-on: ubuntu-latest
    steps:
      - name: Créer les labels de modération si nécessaire
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh label create "community-feedback" --repo "$REPOSITORY" --color "1D76DB" --description "Retour public sur une offre DealRadar" 2>/dev/null || true
          gh label create "needs-triage" --repo "$REPOSITORY" --color "FBCA04" --description "Retour communautaire à vérifier" 2>/dev/null || true

      - name: Ajouter le statut de modération
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label "community-feedback,needs-triage"
